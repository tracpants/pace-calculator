name: Code Quality and Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # Check what files changed to optimize CI runs
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
      has-code-changes: ${{ steps.changes.outputs.has-code-changes }}
      has-test-changes: ${{ steps.changes.outputs.has-test-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect file changes
        id: changes
        run: |
          # Get changed files (for push events, compare with previous commit)
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            # For pull requests, compare with base branch
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Check if only documentation files changed
          CODE_PATTERN="^(src/|tests/|scripts/|\.js$|\.css$|package\.json|vite\.config\.js|tailwind\.config\.js|eslint\.config\.js|stylelint\.config\.cjs|vitest\.config\.js|playwright\.config\.js)"
          DOCS_PATTERN="^(README\.md|TASKS\.md|CLAUDE\.md|docs/|LICENSE|\.gitignore)"
          TEST_PATTERN="^tests/"
          
          HAS_CODE_CHANGES=false
          HAS_TEST_CHANGES=false
          DOCS_ONLY=true
          
          while IFS= read -r file; do
            if [[ -n "$file" ]]; then
              if echo "$file" | grep -E "$TEST_PATTERN"; then
                HAS_TEST_CHANGES=true
                HAS_CODE_CHANGES=true
                DOCS_ONLY=false
                echo "Test change detected: $file"
              elif echo "$file" | grep -E "$CODE_PATTERN"; then
                HAS_CODE_CHANGES=true
                DOCS_ONLY=false
                echo "Code change detected: $file"
              elif echo "$file" | grep -E "$DOCS_PATTERN"; then
                echo "Documentation change detected: $file"
              else
                # Other files (like CI configs) should trigger full pipeline
                HAS_CODE_CHANGES=true
                DOCS_ONLY=false
                echo "Other change detected: $file"
              fi
            fi
          done <<< "$CHANGED_FILES"
          
          echo "has-code-changes=$HAS_CODE_CHANGES" >> $GITHUB_OUTPUT
          echo "has-test-changes=$HAS_TEST_CHANGES" >> $GITHUB_OUTPUT
          echo "docs-only=$DOCS_ONLY" >> $GITHUB_OUTPUT
          
          echo "Final decision: HAS_CODE_CHANGES=$HAS_CODE_CHANGES, HAS_TEST_CHANGES=$HAS_TEST_CHANGES, DOCS_ONLY=$DOCS_ONLY"

  code-quality:
    runs-on: ubuntu-latest
    needs: detect-changes
    # Run minimal checks on any event when code changes
    if: needs.detect-changes.outputs.has-code-changes == 'true'

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linters (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Validate design tokens
        run: npm run validate:tokens
        continue-on-error: true # Allow existing violations while preventing new ones

      - name: Run unit tests
        run: npm run test:run

      - name: Generate coverage badges
        run: npm run badges

      - name: Commit badge updates
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add badges/ README.md || true
          git diff --staged --quiet || git commit -m "docs: update test and coverage badges [skip ci]"
          git push || true

      - name: Build project
        run: npm run build

      # E2E and artifact upload removed for faster, basic checks

  # Update badges in PRs when test files change
  update-badges-pr:
    runs-on: ubuntu-latest
    needs: detect-changes
    # Only run on PRs when test files have changed
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has-test-changes == 'true'
    
    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Checkout the PR branch with full history to allow pushing
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests and generate badges
        run: npm run badges

      - name: Commit badge updates to PR
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add badges/ README.md || true
          if ! git diff --staged --quiet; then
            git commit -m "docs: update test and coverage badges [skip ci]"
            git push origin ${{ github.head_ref }}
          else
            echo "No badge changes to commit"
          fi

  # Lightweight job for documentation-only changes
  docs-validation:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate documentation changes
        run: |
          echo "✅ Documentation-only changes detected"
          echo "Skipping expensive CI operations (tests, builds, browser installation)"
          echo "Changes detected in: README.md, TASKS.md, or docs/ directory"
          
          # Basic validation that files are readable
          if [ -f "README.md" ]; then
            echo "✅ README.md exists and is readable"
          fi
          
          if [ -f "TASKS.md" ]; then
            echo "✅ TASKS.md exists and is readable"
          fi
          
          if [ -f "CLAUDE.md" ]; then
            echo "✅ CLAUDE.md exists and is readable"
          fi
          
          echo "📚 Documentation validation complete - no code testing required"

  # Always run security audit (lightweight and important for dependency tracking)
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true
